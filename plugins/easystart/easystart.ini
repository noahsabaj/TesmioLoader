; easystart - a citizen's needs arrive with the century.
;
; Edit plugins\easystart\easystart.ini, not build\plugins\easystart.ini -
; build.bat copies the former over the latter on every build.
;
; UTF-8 without a BOM. Never write this file with PowerShell's -Encoding UTF8:
; 5.1 adds a BOM, the first section header stops matching and every setting
; silently falls back to its default. Use
;   [System.IO.File]::WriteAllText($p, $s, (New-Object Text.UTF8Encoding($false)))
;
;
; WHAT IT DOES
;
; A need that has not been unlocked yet is invisible to everything that turns
; needs into happiness and health. The citizen still carries it: they still walk
; to the pub, the church, the cinema and the shop if those exist, and the goods
; are still bought and delivered. Only the consequences are held back - no
; unhappiness for its absence, no bonus for having it, and no "N Citizen(s) were
; unable to get X".
;
; A locked need's own status float is also held at `locked_status`, so twenty
; years of "no cinema" do not leave the culture status at zero on the day the
; cinema starts counting.
;
;
; WHAT IS NOT HERE, AND WHY
;
;   sewage    has no penalty of its own in the game. A full sewage store stops
;             the building drawing water and the player sees "No water", so it
;             is already covered by `water`.
;   school
;   kindergarten
;             neither costs happiness or health. They are the "Education
;             simulation" option, which is a single switch for both - see
;             `education` below.
;   crime
;   pollution
;             real reasons, but they are consequences of the town rather than
;             needs of a citizen, so they are left alone.


[easystart]

; 0 unloads the plugin entirely.
enabled = 1

; The nine needs a citizen carries as a demand: food, meat, clothes,
; electronics, alcohol, religion, culture, sport, health. 0 leaves all nine
; exactly as the base game has them.
demands = 1

; The three that come from the building side: electricity, water, heating.
utilities = 1

; Hold a locked need's status float at `locked_status` instead of letting the
; daily planner decay it. Leaving this off means the unlock year arrives with
; every locked status already at rock bottom.
pin_status = 1

; What a locked status is held at. 1.0 is "fully content"; 0.5 leaves some room
; for the need to feel new when it unlocks. Food's status is satiety, so 1.0
; there means nobody starves while food is locked.
locked_status = 1.0

; Drop locked needs out of the citizen's unsatisfied list as well, which is what
; raises the "N Citizen(s) were unable to get X" message.
clear_unsatisfied = 1

; One line per year change saying what is still to come, plus a one-off dump of
; the first citizen whose demand list was actually shortened.
probe = 0


; ---------------------------------------------------------------------------
; [unlock] - the year each need starts to matter.
;
;   <year>   from 1 January of that year onwards
;   off      never - the need is left exactly as the base game has it
;   always   live from the first day (same as 0)
;
; The date the plugin reads is the game's own year at game+0x594, the one the
; corner of the screen shows and the one a save carries as $DATE_YEAR.
;
; The schedule below assumes a republic founded in 1920, with the first year as
; a grace period in which the citizens want for nothing at all. A base-game
; start is 1960, 1970 or 1980, at which point every line here is already in the
; past and the plugin does nothing - that is intended. It is for a map that
; starts early.
; ---------------------------------------------------------------------------

[unlock]

; 1921 - the republic has settled in. Bread and the church, and nothing else.
food        = 1921
religion    = 1921

; 1927 - a wardrobe and meat on the table.
meat        = 1927
clothes     = 1927

; 1932 - the first five-year plan. Sport, drink, and (see `education`) schools.
alcohol     = 1932
sport       = 1932

; 1940 - cinema, theatre, and a doctor to go to.
culture     = 1940
health      = 1940

; 1945 - the wires reach the houses.
electricity = 1945

; 1950 - plumbing. `water` covers sewage too, because sewage acts through it.
water       = 1950
heating     = 1950

; 1955 - a radio, then a television.
electronics = 1955

; Children in school and parents freed by a kindergarten. Off by default, and
; read the warning: this is the game's own "Education simulation" option and it
; is **one switch for both**, so school and kindergarten cannot yet be given
; different years. What the plugin does is turn that option to Simple for the
; simulation only - the twelve places the citizen and job code test it - and
; leave every place the interface tests it alone, so kindergartens and schools
; stay buildable. That last part has not been watched in game.
;
; Setting it also removes the education *requirement* on jobs before that year,
; which is the same option's third effect and is the point: nobody can have
; been to a school that does not exist yet.
education   = off


; ---------------------------------------------------------------------------
; [unlock_resource] - the same, for a good the `needs` plugin added.
;
; `list` is the whole set of names, comma separated; each then takes a year of
; its own. The name is the resource name from plugins/resources.ini, matched
; against the record the citizen's demand points at.
;
; Nothing here is on by default, and a name that no resource answers to is
; simply never matched.
; ---------------------------------------------------------------------------

[unlock_resource]

; list = medicine, furniture
; medicine  = 1940
; furniture = 1960
