; construction - how far a construction office reaches for work.
; This file is UTF-8, no BOM.
;
; Read by plugins\construction.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL stops anything further being written and restores
; the base game's own code exactly - but not the offices it has already set:
; the range lives in the save, so a raise is permanent. See the NOTE at the
; bottom of this file. Nothing here changes the save format.
;
; WHAT IT IS FOR. A construction office only picks up jobs near itself, so a
; site placed across town is never started however idle the office is and
; however many vehicles it has parked. `office_range` below is meant to make
; that reach yours.
;
; WHAT IT CAN DO TODAY. Exactly that. The range turned out to be a plain int on
; the construction office itself - the number its own window prints outright,
; "<1,000m" on a freshly built office - so `write_range` below simply sets it,
; with no patched code at all. Confirmed in a running game. `raise_ceiling`
; separately lifts the 3500 the window's + button stops at, so the value stays
; adjustable by hand.
;
; IT DOES NOT TOUCH WALKING OR PERSONAL-CAR DISTANCE. Those belong to
; plugins\walking - the Steam Workshop item "Increase Walking Distance" - and
; they are about CITIZENS walking or driving to work and shops, which is a
; different thing from a construction office dispatching its own fleet. Set
; `distance` and `car_distance` in walking.ini and leave this file out of it.

[construction]

; 0 leaves the game alone and the plugin unloads without reading or patching
; anything.
enabled = 1

; Find the range. This is what found it, and it is now purely a diagnostic.
;
; Build one construction office, then place construction sites around it at
; increasing distances - a few close, a few far - and let a report land between
; each. The plugin logs how far out the office reached for work and where the
; nearest job it REFUSED is. When those two do not overlap, the range is
; bracketed between them, and it then searches the office, its type, the game
; object and the executable's constant pool for a number in that bracket.
;
; Build the road out to the far sites FIRST. A site with no road is refused for
; a completely different reason and the two look identical in the log.
;
; It reads and writes nothing itself. The range IS known - it is the office's
; own +0xFC8 - so this is what you would run again after a game update moved
; the field, not a step you have to take now. Set it to 0 for a quiet log.
;
; Turning it off does not turn off `write_range`: both are driven by the same
; render hook, and that hook is installed if EITHER is on. (It used to hang off
; this key alone, which made `probe = 0` with `write_range = 1` a silent no-op.)
probe = 1

; Write the patches. 0 reads only.
;
; It is 0 because the site tables in construction.cpp are still empty. With
; patch = 1 and an empty table the plugin logs "no address for ... yet" and
; does nothing, which is the right way round - an empty table is a question
; nobody has answered, not a game build that has gone wrong.
;
; When one site of a group verifies and another does not, NOTHING in that group
; is written. A range the simulation honours while the office window still
; draws the old one is worse than neither, and it is the bug plugins\walking
; took four versions to stop shipping.
patch = 0

; Hold every construction office's auto-search range at `office_range` below.
;
; THIS IS THE FEATURE, and it is the one thing in this plugin that writes to
; the game. The range turned out to be a plain int on the office - the same
; number its window shows, "<1,000m" on a fresh one - so it is simply set, with
; no patched code at all. That is far more robust than a code patch: there is
; no address for a game update to move.
;
; CONFIRMED WORKING, and it STICKS. An office set this way really does reach
; that far: a site placed about 9 km from an office was picked up
; automatically, and the yellow road overlay extends to match. The simulation
; never puts the value back.
;
; 0 leaves the game's own value alone and the plugin only reads.
write_range = 1

; What a construction office starts life at in the base game, in metres.
;
; This is what makes `office_range` a DEFAULT rather than a cage. An office
; still carrying this value has been touched by nobody, so the plugin sets it -
; one you have set to anything else is yours, and the plugin never touches it
; again. So a new office starts at `office_range`, and winding one down to 2000
; in its own window sticks.
;
; The test is the value rather than a list of offices already seen, because a
; value survives a save and reload and a pointer does not.
;
; 1000 IS THE NUMBER, settled the only way it could be: both of this plugin's
; writes switched off, a new map, one freshly built office, and its window read
; "<1,000m" before anything had touched it. Two other numbers auditioned for
; this key and both were wrong for instructive reasons. 3500 was read out of
; sixteen probed offices that all agreed - but they agreed because that save's
; offices had all been ridden to the button ceiling by hand; 3500 is where the
; stock + button STOPS (`mov [rsi+0xFC8],3500` is the clamp, not the cradle).
; And 1000's own first stay here was a guess that happened to be right.
;
; Checking it on your own build takes a minute, the same way: set
; `write_range = 0` and `raise_ceiling = 0`, start a new map, build one
; construction office, and read the number in its window before touching
; anything. That is `game_default`.
;
; 0 turns the test off and every office is held at `office_range` on every
; frame. That was the first version's behaviour and it is almost certainly not
; what you want: the minus button in the office window stops working, because
; the click lands and the next frame puts the old value straight back, which
; looks like the number flickering and refusing to move.
;
; One consequence worth knowing: if you deliberately want an office at exactly
; this value, the plugin will set it anyway - wind it to any other number and
; it is yours.
game_default = 1000

; THE PLUGIN'S OWN BOOKKEEPING - NOT YOURS TO SET.
;
; The last value the plugin actually wrote into an office. It writes this key
; itself, after a pass that changed something, and it is here rather than in
; memory because it has to outlive the game: an office set last Tuesday is
; still holding that number today.
;
; What it buys: an office carrying this value is the plugin's own work, not
; yours, so when you change `office_range` it FOLLOWS - downwards exactly as
; readily as upwards. Without it, every office the plugin has ever touched is
; frozen at whatever the ini said the day it was built, and `office_range`
; would only ever govern offices that do not exist yet.
;
; THE HONEST LIMIT. An office you deliberately set to exactly this number by
; hand is indistinguishable from one the plugin set, and the plugin claims it.
; That is the right trade: the alternative is remembering nothing, which strands
; every office the plugin has raised. The number is one you would have to pick
; on purpose - it is whatever `office_range` was last session - and the cost of
; being wrong is that the office follows a setting you are already editing.
;
; Two edges, both handled: 0 means nothing has been written yet and only the
; `game_default` test applies, and a value equal to `game_default` is ignored
; because it would claim nothing that test does not already claim. Only one
; value is remembered, so if you change `office_range` twice without loading
; the map in between, offices still holding the older one look hand-set.
;
; None of this applies with `game_default = 0`, where every office is held at
; `office_range` regardless.
written_range = 0

; Raise the ceiling the office window's own + button stops at.
;
; The base game's 3500 is not read from anywhere - it is an imm32, baked in
; seven times over. Four of those are a validator, a plain
; `if (range > 3500) range = 3500`. The other three are the top rung of the
; menu the - and + buttons step through, and those are the ones that make the
; buttons behave: + stops at 3500 because that is the highest rung, and
; pressing - on an office this plugin had set to 10000 gave 3500 rather than
; stepping down, because anything above the top rung snaps to it.
;
; SEVEN instructions carry it, and all seven are patched or none of them are:
;
;   0x74E08F, 0x74E09F   the validator's compare and store
;   0x751A5A, 0x751A69   a second copy of the same rule
;   0x76C792             the minus button's top rung
;   0x76C7C5, 0x76C7D1   the plus button's compare and top rung
;
; The first four are a validator and are NOT what the buttons obey - that is
; why raising only those still left + stopping at 3500. Three of the seven
; carry the +0xFC8 displacement - the validator's two stores and the second
; compare - which is what ties the set to this field rather than to some other
; 3500 in the executable; every one of the seven is compared against the bytes
; this build ships before anything is written, so a game update makes the patch
; refuse rather than corrupt the process.
;
; With `ceiling` left at 3500 there is nothing to write - all seven already
; hold it - so the plugin verifies them, says so, and leaves the executable
; alone rather than rewriting seven immediates with the value they had.
;
; With this on, the buttons in an office's window reach `ceiling` below instead
; of stopping at 3500 - which is what makes `office_range` a starting value
; rather than the only value you can have. They still step, not slide: the
; rungs between the bottom and the top are the game's own, and `ceiling`
; explains them.
;
; 0 leaves the executable completely untouched.
raise_ceiling = 1

; What the + button should stop at instead. Clamped to at least 3500 (below
; that it would be a restriction rather than a lift) and at most 20000 - the
; same ceiling `office_range` has, because a value above it is one the plugin's
; own plausibility check would then refuse to write.
;
; THE BUTTONS ARE NOT A SLIDER. They step through a fixed menu of rungs, and
; this replaces the top one - so the menu reads
;
;     100  ->  r9d  ->  2000  ->  3000  ->  ceiling
;
; and there is nothing in between. `r9d` is the one rung the handler works out
; at run time instead of carrying as an immediate, so the disassembly does not
; name it and neither does this file; everything either side of it is written
; out in construction.cpp beside the ladder's own bytes. (1000 stood here for a
; while and was a guess - it is not one of the rungs.)
;
; Adding a rung would mean emitting code; replacing the top one is four bytes.
;
; Keep this equal to `office_range` below unless you have a reason not to.
; Then the highest the button reaches is the value a newly built office
; already starts at, and the menu and the config tell the same story. Set them
; apart and you get a setting you can be given but cannot choose by hand.
;
; Worth knowing before setting this very high: the office's search is
; breadth-first over the road graph, so the work grows with the square of the
; range and a huge value makes placement pause in a built-up city.
ceiling = 10000

; How far, in metres, a construction office will reach for a job.
;
; This is the setting the whole plugin exists for. It is a path length along
; roads, not a straight line, so a site 400 m away across a river may be 1200 m
; of driving.
;
; The plugin refuses anything past 20000 for the same reason plugins\walking
; does: these searches are breadth-first over the road graph, so the work grows
; with the square of the limit and a huge value makes every placement pause.
;
; This is driven by `write_range` above, not by `patch` - `patch` belongs to the
; code-patch route below, which the field write made unnecessary.
office_range = 10000

; How many jobs one office will take on at once, if it turns out the limit is a
; count rather than a distance.
;
; The probe measures both, because they produce the same symptom - an idle
; office next to unstarted work - and only one of them can be the real cause.
; If a refused site is NEARER than one the office already took, the gate is a
; count and this is the setting that matters; if everything nearby was taken
; and everything far was refused, it is a range and `office_range` is.
;
; 0 removes the cap. Anything above 0 is a cap of your own, which is worth
; having: an office holding fifty jobs spreads its vehicles over all of them
; and finishes none.
office_limit = 0

; Which part of a construction office to compare while probing.
;
; Below 0x300 is mostly pointers and handles and would bury the answer. The
; upper bound is a readability bound and not the size of the object - the size
; is not known, and anything past the real end of the building belongs to
; somebody else, so the probe stops at whichever comes first.
probe_from   = 768
probe_to     = 6144

; The number to hunt for inside a construction office, as an int and a float.
;
; THIS IS THE SHORTCUT, and it came from the office's own window. That window
; shows the auto-search range outright - "<1,000m" on a fresh office, with a
; minus and a plus beside it - so the range is a per-office number whose value
; you can read off the screen before the search even starts.
;
; So: open an office, read the number its window shows, put it here, and the
; probe reports every offset in that office holding it. Then click the minus or
; the plus and `probe_diff` below says which of those offsets actually moved.
; That one is the range.
;
; 1000 is what a newly built office holds - see `game_default` above. If your
; office shows something else - because you have wound it up or down by hand,
; or because this plugin has already set it to `office_range` - put that here
; instead. It is the number on the screen that matters, not the number the
; window was born with.
;
; 0 turns the hunt off.
probe_expect = 1000

; Report every 4-byte slot of an office that changed since the last report.
;
; This is the half that confirms what `probe_expect` found. Slots that decode
; as a pointer are skipped; anything that could be a distance in metres is
; printed as both an int and a float.
probe_diff = 1

; Seconds between reports, and how many of an office's jobs to print in each.
probe_period = 5
probe_sites  = 8

; The part of the executable searched for the range once it has been bracketed.
;
; The default spans the pool the game keeps its layout constants and rates in -
; where walking's 480 and 530, cities' 1000 and every deposit search radius all
; live. A global distance is far likelier to be here than in any structure,
; because no building.ini declares one and every office behaves the same.
;
; Decimal, because the profile API this is read through does not take 0x.
; 9474048 is 0x909000 and 9486336 is 0x90C000.
rdata_from = 9474048
rdata_to   = 9486336


; NOTE - WHAT THIS PLUGIN DOES IS PERMANENT
;
; The range lives in the save, on the office. So a raise is not something the
; plugin holds up while it is loaded: it is written once and the office keeps
; it for ever, plugin or no plugin. Delete the DLL and every office it raised
; still reaches `office_range`; the base game's 3500 comes back only for
; offices built after that.
;
; If you want a shorter leash, do not remove the plugin - LOWER `office_range`
; and let the plugin bring them down. An office holding `written_range` is one
; the plugin set, so it follows the new number, downwards exactly as readily as
; upwards; nothing here is raise-only. Offices you set by hand are still yours
; and are still left alone, and offices on a map you do not load are not
; touched until you load it.
;
; Which jobs an office has already taken on is saved rather than derived from
; the map in the same way, so a save written while the reach was long still
; holds the offices that took distant work, and they keep those sites until
; they finish however you set the range afterwards.
;
; The save format itself is unchanged either way, so a save stays loadable with
; or without this plugin - unlike a resource being added.
;
; There is deliberately no `trip_limit` here. Whether this game times a long
; journey out at all is unestablished - nothing has been shown to re-check a
; distance once a pair is in a building's connection list - so the probe
; reports on it and no setting pretends to control it. A key that provably does
; nothing is worse than no key.
