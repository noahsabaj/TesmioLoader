; construction - the limits on a construction office. This file is UTF-8, no BOM.
;
; Read by plugins\construction.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL restores the base game exactly; this file only tunes
; the feature. Nothing here changes the save format.
;
; THIS IS THE MEASURING HALF AND FOR NOW IT IS ALL THERE IS. With patch = 0 the
; plugin reads construction offices and changes nothing whatsoever about the
; game. What it is for is finding two things static analysis has never settled:
; which field of a construction office holds the set of sites it has taken on,
; and what stops that set growing.
;
; IT DOES NOT TOUCH WALKING OR PERSONAL-CAR DISTANCE. Those belong to
; plugins\walking - the Steam Workshop item "Increase Walking Distance". Set
; `distance` and `car_distance` in walking.ini and leave this file out of it.

[construction]

; 0 leaves the game alone and the plugin unloads without reading or patching
; anything.
enabled = 1

; Follow the construction offices on the map and report what moves.
;
; This is how the settings below get their addresses. Run with probe = 1, build
; one construction office, and place construction sites near it one at a time,
; pausing a few seconds between them so a report lands. The log names the
; offset of the list the office keeps, how many sites it is holding, and how
; many live sites on the map nobody has picked up.
;
; When the held count stops climbing while unclaimed sites are still going up,
; the number it stopped at is the cap - and that number is what to search the
; executable for.
;
; It reads and writes nothing. Set it to 0 once the addresses are known.
probe = 1

; The second half. 0 reads only; 1 writes the patches.
;
; It is 0 because the site table in construction.cpp is still empty. With
; patch = 1 and an empty table the plugin logs "no address for ... yet" and
; does nothing, which is the right way round - an empty table is a question
; nobody has answered, not a game build that has gone wrong.
;
; When one site of a group verifies and another does not, NOTHING in that group
; is written. A cap the simulation honours while the office window still draws
; the old one is worse than neither, and it is the bug plugins\walking took
; four versions to stop shipping.
patch = 0

; How many construction sites one office will take on automatically.
;
; A construction office services a set of sites and offers to pick them up
; without being told to - the game's own script API calls the count
; nConstructionBuildingNum. The base game caps how many it will accept, so a
; site placed near an otherwise idle office is simply never started and the
; office sits with its vehicles parked.
;
; 0 removes the cap. Anything above 0 is a cap of your own, which is worth
; having: an office holding fifty sites spreads its vehicles across all of them
; and finishes none.
;
; Does nothing until `patch` is 1 AND the site table has an address in it.
office_limit = 0

; Which part of a construction office to compare, in bytes, while probing.
;
; Below 0x300 is mostly pointers and handles and would bury the answer. The
; upper bound is a readability bound and not the size of the object - the size
; is not known, and anything past the real end of the building belongs to
; somebody else, so the probe stops at whichever comes first.
probe_from   = 768
probe_to     = 6144

; Seconds between reports, and how many of an office's sites to print in each
; one. The offices are re-read on every frame the game renders; this is only
; how often the differences are written to the log.
probe_period = 5
probe_sites  = 8


; NOTE
;
; Which sites an office has taken on is stored in the save rather than derived
; from the map. Removing the plugin, or lowering `office_limit` again, restores
; the cap for every assignment made from then on - but a save written while it
; was raised still holds the offices that took more than the cap, and they keep
; them until those sites finish.
;
; The save format itself is unchanged either way, so a save stays loadable with
; or without this plugin - unlike a resource being added.
;
; There is deliberately no `trip_limit` here. Whether this game times a long
; journey out at all is unestablished - nothing has been shown to re-check a
; distance once a pair is in a building's connection list - so the probe
; reports on it and no setting pretends to control it. A key that provably does
; nothing is worse than no key.
