; construction - how far a construction office reaches for work.
; This file is UTF-8, no BOM.
;
; Read by plugins\construction.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL restores the base game exactly; this file only tunes
; the feature. Nothing here changes the save format.
;
; WHAT IT IS FOR. A construction office only picks up jobs near itself, so a
; site placed across town is never started however idle the office is and
; however many vehicles it has parked. `office_range` below is meant to make
; that reach yours.
;
; WHAT IT CAN DO TODAY. Not that - the range has not been found in the game's
; code yet, and this release is the half that finds it. With patch = 0 the
; plugin reads construction offices and changes nothing whatsoever. See `probe`.
;
; IT DOES NOT TOUCH WALKING OR PERSONAL-CAR DISTANCE. Those belong to
; plugins\walking - the Steam Workshop item "Increase Walking Distance" - and
; they are about CITIZENS walking or driving to work and shops, which is a
; different thing from a construction office dispatching its own fleet. Set
; `distance` and `car_distance` in walking.ini and leave this file out of it.

[construction]

; 0 leaves the game alone and the plugin unloads without reading or patching
; anything.
enabled = 1

; Find the range. This is what this release is.
;
; Build one construction office, then place construction sites around it at
; increasing distances - a few close, a few far - and let a report land between
; each. The plugin logs how far out the office reached for work and where the
; nearest job it REFUSED is. When those two do not overlap, the range is
; bracketed between them, and it then searches the office, its type, the game
; object and the executable's constant pool for a number in that bracket.
;
; Build the road out to the far sites FIRST. A site with no road is refused for
; a completely different reason and the two look identical in the log.
;
; It reads and writes nothing. Set it to 0 once the range is known.
probe = 1

; Write the patches. 0 reads only.
;
; It is 0 because the site tables in construction.cpp are still empty. With
; patch = 1 and an empty table the plugin logs "no address for ... yet" and
; does nothing, which is the right way round - an empty table is a question
; nobody has answered, not a game build that has gone wrong.
;
; When one site of a group verifies and another does not, NOTHING in that group
; is written. A range the simulation honours while the office window still
; draws the old one is worse than neither, and it is the bug plugins\walking
; took four versions to stop shipping.
patch = 0

; Hold every construction office's auto-search range at `office_range` below.
;
; THIS IS THE FEATURE, and it is the one thing in this plugin that writes to
; the game. The range turned out to be a plain int on the office - the same
; number its window shows as "<3,500m" - so the first thing worth trying is
; simply setting it, with no patched code at all. That is far more robust than
; a code patch: there is no address for a game update to move.
;
; The open question is whether it STICKS. If the simulation clamps the value
; back to 3500, the log says so outright, once, and the answer is then a code
; patch on whatever does the clamping rather than on the field.
;
; 0 leaves the game's own value alone and the plugin only reads.
;
; CONFIRMED WORKING. An office set this way really does reach that far: a site
; placed about 9 km from an office was picked up automatically, and the yellow
; road overlay extends to match. The game does not clamp the value back.
write_range = 1

; What a construction office starts life at in the base game, in metres.
;
; This is what makes `office_range` a DEFAULT rather than a cage. Only an
; office still carrying this value is raised - one you have set to anything
; else is yours, and the plugin never touches it again. So a new office starts
; at `office_range`, and winding one down to 2000 in its own window sticks.
;
; The test is the value rather than a list of offices already seen, because a
; value survives a save and reload and a pointer does not.
;
; 0 turns the test off and every office is held at `office_range` on every
; frame. That was the first version's behaviour and it is almost certainly not
; what you want: the minus button in the office window stops working, because
; the click lands and the next frame puts the old value straight back, which
; looks like the number flickering and refusing to move.
;
; One consequence worth knowing: if you deliberately want an office at exactly
; this value, the plugin will raise it. Set it to something else, or use 0 and
; accept the trade.
game_default = 1000

; Raise the ceiling the office window's own + button stops at.
;
; The base game's 3500 is not read from anywhere - it is an imm32 baked into
; the button handler, as a plain `if (range > 3500) range = 3500`. That is why
; + stops there, and why pressing - on an office set to 10000 snapped it to
; 3500 rather than stepping down: the click ran the clamp.
;
; Four instructions carry it, at rva 0x74E08F, 0x74E09F, 0x751A5A and 0x751A69,
; and all four are patched or none of them are. Three of the four carry the
; +0xFC8 displacement, which is what ties them to this field rather than to
; some other 3500 in the executable; every one is compared against the bytes
; this build ships before anything is written, so a game update makes the
; patch refuse rather than corrupt the process.
;
; With this on, every office is freely adjustable in game between the game's
; own minimum and `ceiling` below - which is what makes `office_range` a
; starting value rather than the only value you can have.
;
; 0 leaves the executable completely untouched.
raise_ceiling = 1

; What the + button should stop at instead. Clamped to at least 3500 (below
; that it would be a restriction rather than a lift) and at most 100000.
;
; THE BUTTONS ARE NOT A SLIDER. They step through a fixed menu of values, and
; this replaces the top one - so the menu reads
;
;     1000  ->  2000  ->  3000  ->  ceiling
;
; and there is nothing in between. Adding a rung would mean emitting code;
; replacing the top one is four bytes.
;
; Keep this equal to `office_range` below unless you have a reason not to.
; Then the highest the button reaches is the value a newly built office
; already starts at, and the menu and the config tell the same story. Set them
; apart and you get a setting you can be given but cannot choose by hand.
;
; Worth knowing before setting this very high: the office's search is
; breadth-first over the road graph, so the work grows with the square of the
; range and a huge value makes placement pause in a built-up city.
ceiling = 10000

; How far, in metres, a construction office will reach for a job.
;
; This is the setting the whole plugin exists for. It is a path length along
; roads, not a straight line, so a site 400 m away across a river may be 1200 m
; of driving.
;
; The plugin refuses anything past 20000 for the same reason plugins\walking
; does: these searches are breadth-first over the road graph, so the work grows
; with the square of the limit and a huge value makes every placement pause.
;
; Does nothing until `patch` is 1 AND the range has been found.
office_range = 10000

; How many jobs one office will take on at once, if it turns out the limit is a
; count rather than a distance.
;
; The probe measures both, because they produce the same symptom - an idle
; office next to unstarted work - and only one of them can be the real cause.
; If a refused site is NEARER than one the office already took, the gate is a
; count and this is the setting that matters; if everything nearby was taken
; and everything far was refused, it is a range and `office_range` is.
;
; 0 removes the cap. Anything above 0 is a cap of your own, which is worth
; having: an office holding fifty jobs spreads its vehicles over all of them
; and finishes none.
office_limit = 0

; Which part of a construction office to compare while probing.
;
; Below 0x300 is mostly pointers and handles and would bury the answer. The
; upper bound is a readability bound and not the size of the object - the size
; is not known, and anything past the real end of the building belongs to
; somebody else, so the probe stops at whichever comes first.
probe_from   = 768
probe_to     = 6144

; The number to hunt for inside a construction office, as an int and a float.
;
; THIS IS THE SHORTCUT, and it came from the office's own window. That window
; shows the auto-search range outright - "<3,500m", with a minus and a plus
; beside it - so the range is a per-office number whose value you can read off
; the screen before the search even starts.
;
; So: open an office, read the number its window shows, put it here, and the
; probe reports every offset in that office holding it. Then click the minus or
; the plus and `probe_diff` below says which of those offsets actually moved.
; That one is the range.
;
; 3500 is the ceiling the game's UI allows. If your office shows something else
; - because you have already wound it down - put that here instead.
;
; 0 turns the hunt off.
probe_expect = 3500

; Report every 4-byte slot of an office that changed since the last report.
;
; This is the half that confirms what `probe_expect` found. Slots that decode
; as a pointer are skipped; anything that could be a distance in metres is
; printed as both an int and a float.
probe_diff = 1

; Seconds between reports, and how many of an office's jobs to print in each.
probe_period = 5
probe_sites  = 8

; The part of the executable searched for the range once it has been bracketed.
;
; The default spans the pool the game keeps its layout constants and rates in -
; where walking's 480 and 530, cities' 1000 and every deposit search radius all
; live. A global distance is far likelier to be here than in any structure,
; because no building.ini declares one and every office behaves the same.
;
; Decimal, because the profile API this is read through does not take 0x.
; 9474048 is 0x909000 and 9486336 is 0x90C000.
rdata_from = 9474048
rdata_to   = 9486336


; NOTE
;
; Which jobs an office has taken on is stored in the save rather than derived
; from the map. Removing the plugin, or lowering `office_range` again, restores
; the base game's reach for every assignment made from then on - but a save
; written while it was raised still holds the offices that took distant work,
; and they keep it until those sites finish.
;
; The save format itself is unchanged either way, so a save stays loadable with
; or without this plugin - unlike a resource being added.
;
; There is deliberately no `trip_limit` here. Whether this game times a long
; journey out at all is unestablished - nothing has been shown to re-check a
; distance once a pair is in a building's connection list - so the probe
; reports on it and no setting pretends to control it. A key that provably does
; nothing is worse than no key.
